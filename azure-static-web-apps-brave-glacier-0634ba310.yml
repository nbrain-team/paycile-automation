# Azure DevOps Pipeline for Paycile Frontend Web App
trigger:
  branches:
    include:
    - main
    - develop
  paths:
    include:
    - paycile/*

variables:
  # Build variables
  - name: nodeVersion
    value: '20.x'
  - name: workingDirectory
    value: 'paycile'
  - name: azureServiceConnection
    value: 'plg-service-connection'
  - name: staticWebAppName
    value: 'prod-paycile-plg-web'
  - name: resourceGroupName
    value: 'prod-corp'
  
  # Include the auto-generated variable group
  - group: Azure-Static-Web-Apps-brave-glacier-0634ba310-variable-group

stages:
- stage: Build
  displayName: 'Build Frontend Web App'
  jobs:
  - job: Build
    displayName: 'Build'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'
    
    - task: Cache@2
      displayName: 'Cache npm dependencies'
      inputs:
        key: 'npm | "$(Agent.OS)" | $(workingDirectory)/package-lock.json'
        path: '$(workingDirectory)/node_modules'
        cacheHitVar: 'NPM_CACHE_RESTORED'
    
    - script: |
        cd $(workingDirectory)
        npm ci
      displayName: 'Install dependencies'
    
    - script: |
        cd $(workingDirectory)
        echo "NEXT_PUBLIC_API_URL=$(NEXT_PUBLIC_API_URL)" > .env.production
      displayName: 'Create production environment file'
    
    - script: |
        cd $(workingDirectory)
        npm run build
      displayName: 'Build Next.js application'
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        pathToPublish: '$(workingDirectory)/out'
        artifactName: 'frontend-web'

- stage: Deploy_Dev
  displayName: 'Deploy to Development'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployDev
    displayName: 'Deploy to Dev Environment'
    environment: 'paycile-dev'
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      NEXT_PUBLIC_API_URL: 'https://prod-paycile-plg-api-dev.azurewebsites.net'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download build artifacts'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'frontend-web'
              downloadPath: '$(Pipeline.Workspace)'
          
          - task: AzureCLI@2
            displayName: 'Deploy to Azure Static Web Apps'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Installing Azure Static Web Apps CLI"
                npm install -g @azure/static-web-apps-cli
                
                echo "Listing build artifacts"
                ls -la $(Pipeline.Workspace)/frontend-web
                
                echo "Deploying pre-built files to Azure Static Web Apps"
                # Deploy from the workspace root, pointing to the artifact folder
                swa deploy $(Pipeline.Workspace)/frontend-web \
                  --deployment-token $(AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_GLACIER_0634BA310) \
                  --no-use-keychain \
                  --verbose

- stage: Deploy_Prod
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProd
    displayName: 'Deploy to Production Environment'
    environment: 'paycile-production'
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      NEXT_PUBLIC_API_URL: 'https://prod-paycile-plg-api.azurewebsites.net'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download build artifacts'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'frontend-web'
              downloadPath: '$(Pipeline.Workspace)'
          
          - task: AzureCLI@2
            displayName: 'Deploy to Azure Static Web Apps'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Installing Azure Static Web Apps CLI"
                npm install -g @azure/static-web-apps-cli
                
                echo "Listing build artifacts"
                ls -la $(Pipeline.Workspace)/frontend-web
                
                echo "Deploying pre-built files to Azure Static Web Apps"
                # Deploy from the workspace root, pointing to the artifact folder
                swa deploy $(Pipeline.Workspace)/frontend-web \
                  --deployment-token $(AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_GLACIER_0634BA310) \
                  --no-use-keychain \
                  --verbose

