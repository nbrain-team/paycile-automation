# Azure DevOps Pipeline for PLG Backend API (Docker)
trigger:
  branches:
    include:
    - main
    - develop
  paths:
    include:
    - adtv-event-automation/apps/server/*

variables:
  # Build variables
  buildConfiguration: 'Release'
  nodeVersion: '20.x'
  workingDirectory: 'adtv-event-automation/adtv-migration-package/apps/server'
  
  # Docker variables
  containerRegistry: 'paycileregistry-gadacgg8gwd8evfv.azurecr.io'
  imageRepository: 'paycile-plg-api'
  dockerfilePath: '$(workingDirectory)/Dockerfile'
  
  # Azure resources
  azureServiceConnection: 'plg-service-connection'
  appServiceName: 'prod-paycile-plg-api'
  resourceGroupName: 'prod-corp'
  keyVaultName: 'prod-plg-vault'

stages:
- stage: Build
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: Build
    displayName: 'Build'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - task: AzureCLI@2
      displayName: 'Build and push Docker image to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(workingDirectory)'
        inlineScript: |
          # Login to ACR
          az acr login --name paycileregistry
          
          # Build the images (exit on failure)
          echo "=== Building Docker Images ==="
          if ! docker build -t $(containerRegistry)/$(imageRepository):$(Build.BuildId) .; then
            echo "❌ Docker build failed!"
            exit 1
          fi
          
          if ! docker build -t $(containerRegistry)/$(imageRepository):latest .; then
            echo "❌ Docker build (latest tag) failed!"
            exit 1
          fi
          
          # Push the images (exit on failure)
          echo "=== Pushing Docker Images ==="
          if ! docker push $(containerRegistry)/$(imageRepository):$(Build.BuildId); then
            echo "❌ Docker push (build tag) failed!"
            exit 1
          fi
          
          if ! docker push $(containerRegistry)/$(imageRepository):latest; then
            echo "❌ Docker push (latest tag) failed!"
            exit 1
          fi
          
          echo "✅ Images successfully built and pushed:"
          echo "   • $(containerRegistry)/$(imageRepository):$(Build.BuildId)"
          echo "   • $(containerRegistry)/$(imageRepository):latest"

- stage: Deploy_Dev
  displayName: 'Deploy to Development'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployDev
    displayName: 'Deploy to Dev Environment'
    environment: 'paycile-dev'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureKeyVault@2
            displayName: 'Get secrets from Key Vault'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              KeyVaultName: '$(keyVaultName)'
              SecretsFilter: '*'
              RunAsPreJob: true
          
          - task: AzureCLI@2
            displayName: 'Deploy Docker container to Azure Web App Dev'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # First check if the web app exists and its current configuration
                echo "=== Current Dev Web App Configuration ==="
                az webapp show --name $(appServiceName)-dev --resource-group $(resourceGroupName) --query "{linuxFxVersion:linuxFxVersion,kind:kind}" -o table
                
                # Set the web app to use Linux and container
                echo "=== Configuring Dev Web App for Container ==="
                az webapp config set \
                  --name $(appServiceName)-dev \
                  --resource-group $(resourceGroupName) \
                  --linux-fx-version "DOCKER|$(containerRegistry)/$(imageRepository):$(Build.BuildId)"
                
                # Configure container settings
                az webapp config container set \
                  --name $(appServiceName)-dev \
                  --resource-group $(resourceGroupName) \
                  --docker-custom-image-name $(containerRegistry)/$(imageRepository):$(Build.BuildId) \
                  --docker-registry-server-url https://$(containerRegistry)
                
                # Enable container logging
                az webapp log config \
                  --name $(appServiceName)-dev \
                  --resource-group $(resourceGroupName) \
                  --docker-container-logging filesystem
                
                # Update app settings
                az webapp config appsettings set \
                  --name $(appServiceName)-dev \
                  --resource-group $(resourceGroupName) \
                  --settings \
                    NODE_ENV="development" \
                    PORT="8000" \
                    WEBSITES_PORT="8000" \
                    DATABASE_URL="$(DATABASE-URL)" \
                    JWT_SECRET="$(JWT-SECRET)" \
                    TWILIO_ACCOUNT_SID="$(TWILIO-ACCOUNT-SID)" \
                    TWILIO_AUTH_TOKEN="$(TWILIO-AUTH-TOKEN)" \
                    GOOGLE_CLIENT_ID="$(GOOGLE-CLIENT-ID)" \
                    GOOGLE_CLIENT_SECRET="$(GOOGLE-CLIENT-SECRET)"
                
                # Restart the web app to pull the new image
                echo "=== Restarting Dev Web App ==="
                az webapp restart --name $(appServiceName)-dev --resource-group $(resourceGroupName)
                
                # Verify the new configuration
                echo "=== New Dev Web App Configuration ==="
                az webapp show --name $(appServiceName)-dev --resource-group $(resourceGroupName) --query "{linuxFxVersion:linuxFxVersion,kind:kind}" -o table
                
                echo "✅ Docker container deployed to $(appServiceName)-dev"

- stage: Deploy_Prod
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProd
    displayName: 'Deploy to Production Environment'
    environment: 'paycile-production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureKeyVault@2
            displayName: 'Get secrets from Key Vault'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              KeyVaultName: '$(keyVaultName)'
              SecretsFilter: '*'
              RunAsPreJob: true
          
          - task: AzureCLI@2
            displayName: 'Deploy Docker container to Azure Web App'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # First check if the web app exists and its current configuration
                echo "=== Current Web App Configuration ==="
                az webapp show --name $(appServiceName) --resource-group $(resourceGroupName) --query "{linuxFxVersion:linuxFxVersion,kind:kind}" -o table
                
                # Set the web app to use Linux and container
                echo "=== Configuring Web App for Container ==="
                
                # Try to use the specific build tag, fall back to latest if it doesn't exist
                IMAGE_TAG=$(Build.BuildId)
                echo "Attempting to use image tag: $IMAGE_TAG"
                
                # Check if the specific tag exists in ACR
                if az acr repository show-tags --name paycileregistry --repository $(imageRepository) --output tsv | grep -q "^$IMAGE_TAG$"; then
                    echo "✅ Using build-specific tag: $IMAGE_TAG"
                    DOCKER_IMAGE="$(containerRegistry)/$(imageRepository):$IMAGE_TAG"
                else
                    echo "⚠️ Build tag $IMAGE_TAG not found, falling back to 'latest'"
                    DOCKER_IMAGE="$(containerRegistry)/$(imageRepository):latest"
                fi
                
                echo "Using Docker image: $DOCKER_IMAGE"
                
                az webapp config set \
                  --name $(appServiceName) \
                  --resource-group $(resourceGroupName) \
                  --linux-fx-version "DOCKER|$DOCKER_IMAGE"
                
                # Configure container settings
                az webapp config container set \
                  --name $(appServiceName) \
                  --resource-group $(resourceGroupName) \
                  --docker-custom-image-name "$DOCKER_IMAGE" \
                  --docker-registry-server-url https://$(containerRegistry)
                
                # Enable container logging
                az webapp log config \
                  --name $(appServiceName) \
                  --resource-group $(resourceGroupName) \
                  --docker-container-logging filesystem
                
                # Update app settings
                az webapp config appsettings set \
                  --name $(appServiceName) \
                  --resource-group $(resourceGroupName) \
                  --settings \
                    NODE_ENV="production" \
                    PORT="8000" \
                    WEBSITES_PORT="8000" \
                    DATABASE_URL="@Microsoft.KeyVault(VaultName=$(keyVaultName);SecretName=DATABASE-URL)" \
                    JWT_SECRET="@Microsoft.KeyVault(VaultName=$(keyVaultName);SecretName=JWT-SECRET)" \
                    TWILIO_ACCOUNT_SID="@Microsoft.KeyVault(VaultName=$(keyVaultName);SecretName=TWILIO-ACCOUNT-SID)" \
                    TWILIO_AUTH_TOKEN="@Microsoft.KeyVault(VaultName=$(keyVaultName);SecretName=TWILIO-AUTH-TOKEN)" \
                    TWILIO_FROM_NUMBER="@Microsoft.KeyVault(VaultName=$(keyVaultName);SecretName=TWILIO-FROM-NUMBER)" \
                    ELEVENLABS_API_KEY="@Microsoft.KeyVault(VaultName=$(keyVaultName);SecretName=ELEVENLABS-API-KEY)" \
                    ELEVENLABS_VOICE_ID="21m00Tcm4TlvDq8ikWAM" \
                    ELEVENLABS_MODEL_ID="eleven_flash_v2_5" \
                    SLYBROADCAST_USERNAME="@Microsoft.KeyVault(VaultName=$(keyVaultName);SecretName=SLYBROADCAST-USERNAME)" \
                    SLYBROADCAST_PASSWORD="@Microsoft.KeyVault(VaultName=$(keyVaultName);SecretName=SLYBROADCAST-PASSWORD)" \
                    SLYBROADCAST_CALLER_ID="@Microsoft.KeyVault(VaultName=$(keyVaultName);SecretName=SLYBROADCAST-CALLER-ID)" \
                    SLYBROADCAST_API_BASE_URL="https://www.mobile-sphere.com/gateway/vmb.php" \
                    SMS_PROVIDER="twilio" \
                    VOICEMAIL_PROVIDER="slybroadcast"
                
                # Restart the web app to pull the new image
                echo "=== Restarting Web App ==="
                az webapp restart --name $(appServiceName) --resource-group $(resourceGroupName)
                
                # Verify the new configuration
                echo "=== New Web App Configuration ==="
                az webapp show --name $(appServiceName) --resource-group $(resourceGroupName) --query "{linuxFxVersion:linuxFxVersion,kind:kind}" -o table
                
                echo "✅ Docker container deployed to $(appServiceName)"          # Quick deployment verification
          - task: PowerShell@2
            displayName: 'Docker Deployment Verification'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "🐳 Docker container deployed successfully!" -ForegroundColor Green
                Write-Host "Container will start automatically with migrations built-in." -ForegroundColor Cyan
                
                # Give container time to start
                Start-Sleep -Seconds 15
                $appUrl = "https://prod-paycile-plg-api.paycile.com/health"
                
                try {
                    Write-Host "Checking container health..." -ForegroundColor Yellow
                    $response = Invoke-RestMethod -Uri $appUrl -TimeoutSec 15 -Method Get
                    if ($response.ok -eq $true) {
                        Write-Host "✅ Container health check: PASSED" -ForegroundColor Green
                    } else {
                        Write-Host "⏳ Container starting up (normal)" -ForegroundColor Yellow
                    }
                }
                catch {
                    Write-Host "⏳ Container starting up (normal)" -ForegroundColor Yellow
                }
                
                Write-Host "" 
                Write-Host "🎉 Docker Deployment Complete!" -ForegroundColor Green
                Write-Host "🌐 API: https://prod-paycile-plg-api.paycile.com/" -ForegroundColor Green
                Write-Host "🐳 Image: $(containerRegistry)/$(imageRepository):$(Build.BuildId)" -ForegroundColor Cyan