# Azure DevOps Pipeline for PLG Backend API
trigger:
  branches:
    include:
    - main
    - develop
  paths:
    include:
    - adtv-event-automation/apps/server/*

variables:
  # Build variables
  buildConfiguration: 'Release'
  nodeVersion: '20.x'
  workingDirectory: 'adtv-event-automation/apps/server'
  
  # Azure resources (update these with your actual resource names)
  azureServiceConnection: 'plg-service-connection' # Create this in Azure DevOps
  appServiceName: 'prod-paycile-plg-api'
  resourceGroupName: 'prod-corp'
  keyVaultName: 'prod-plg-vault'

stages:
- stage: Build
  displayName: 'Build Backend API'
  jobs:
  - job: Build
    displayName: 'Build'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'
    
    - task: Cache@2
      displayName: 'Cache pnpm dependencies'
      inputs:
        key: 'pnpm | "$(Agent.OS)" | $(workingDirectory)/pnpm-lock.yaml'
        path: '$(Pipeline.Workspace)/.pnpm-store'
        cacheHitVar: 'PNPM_CACHE_RESTORED'
    
    - script: |
        npm install -g pnpm@latest
        cd $(workingDirectory)
        pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
        pnpm install --frozen-lockfile
      displayName: 'Install dependencies'
    
    - script: |
        cd $(workingDirectory)
        pnpm prisma generate
      displayName: 'Generate Prisma client'
    
    - script: |
        cd $(workingDirectory)
        pnpm tsc -p tsconfig.json
      displayName: 'Build application'
    
    - script: |
        cd $(workingDirectory)
        # Create production node_modules for deployment using npm (more compatible with Azure)
        rm -rf node_modules
        rm -f package-lock.json
        npm install --only=production
        # Ensure Prisma client is available in production
        npx prisma generate
      displayName: 'Prepare production dependencies'
    
    - script: |
        cd $(workingDirectory)
        # Verify critical dependencies are present
        echo "Verifying dependencies..."
        ls node_modules/ | grep -E "(express|body-parser|cors)" || echo "Missing critical dependencies"
        echo "Express files:"
        ls -la node_modules/express/ || echo "Express not found"
        echo "Body-parser files:"
        ls -la node_modules/body-parser/ || echo "Body-parser not found"
      displayName: 'Verify dependencies'
    
    - task: ArchiveFiles@2
      displayName: 'Archive build output'
      inputs:
        rootFolderOrFile: '$(workingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'backend'

- stage: Deploy_Dev
  displayName: 'Deploy to Development'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployDev
    displayName: 'Deploy to Dev Environment'
    environment: 'paycile-dev'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureKeyVault@2
            displayName: 'Get secrets from Key Vault'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              KeyVaultName: '$(keyVaultName)'
              SecretsFilter: '*'
              RunAsPreJob: true
          
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(appServiceName)-dev'
              package: '$(Pipeline.Workspace)/backend/backend-$(Build.BuildId).zip'
              runtimeStack: 'NODE|20-lts'
              appSettings: '-NODE_ENV "development" -PORT "8000" -DATABASE_URL "$(DATABASE-URL)" -JWT_SECRET "$(JWT-SECRET)" -TWILIO_ACCOUNT_SID "$(TWILIO-ACCOUNT-SID)" -TWILIO_AUTH_TOKEN "$(TWILIO-AUTH-TOKEN)" -GOOGLE_CLIENT_ID "$(GOOGLE-CLIENT-ID)" -GOOGLE_CLIENT_SECRET "$(GOOGLE-CLIENT-SECRET)"'

- stage: Deploy_Prod
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProd
    displayName: 'Deploy to Production Environment'
    environment: 'paycile-production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureKeyVault@2
            displayName: 'Get secrets from Key Vault'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              KeyVaultName: '$(keyVaultName)'
              SecretsFilter: '*'
              RunAsPreJob: true
          
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(appServiceName)'
              package: '$(Pipeline.Workspace)/backend/backend-$(Build.BuildId).zip'
              runtimeStack: 'NODE|20-lts'
              appSettings: '-NODE_ENV "production" -PORT "8000" -DATABASE_URL "$(DATABASE-URL)" -JWT_SECRET "$(JWT-SECRET)" -TWILIO_ACCOUNT_SID "$(TWILIO-ACCOUNT-SID)" -TWILIO_AUTH_TOKEN "$(TWILIO-AUTH-TOKEN)" -TWILIO_FROM_NUMBER "$(TWILIO-FROM-NUMBER)" -GOOGLE_CLIENT_ID "$(GOOGLE-CLIENT-ID)" -GOOGLE_CLIENT_SECRET "$(GOOGLE-CLIENT-SECRET)" -GEMINI_API_KEY "$(GEMINI-API-KEY)" -ELEVENLABS_API_KEY "$(ELEVENLABS-API-KEY)" -ELEVENLABS_VOICE_ID "21m00Tcm4TlvDq8ikWAM" -ELEVENLABS_MODEL_ID "eleven_flash_v2_5" -SLYBROADCAST_USERNAME "$(SLYBROADCAST-USERNAME)" -SLYBROADCAST_PASSWORD "$(SLYBROADCAST-PASSWORD)" -SLYBROADCAST_CALLER_ID "$(SLYBROADCAST-CALLER-ID)" -SLYBROADCAST_API_BASE_URL "https://www.mobile-sphere.com/gateway/vmb.php" -SMS_PROVIDER "twilio" -VOICEMAIL_PROVIDER "slybroadcast" -SCM_DO_BUILD_DURING_DEPLOYMENT "false"'
          
          - task: AzureCLI@2
            displayName: 'Run database migrations'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Waiting for deployment to complete..."
                sleep 30
                
                echo "Running Prisma database migrations..."
                
                # Use Azure CLI to execute commands on the App Service
                # Method 1: Try using az webapp deploy with a post-deployment script
                cat > migrate.sh << 'EOF'
                #!/bin/bash
                cd /home/site/wwwroot
                echo "Current directory: $(pwd)"
                echo "Checking if Prisma is available..."
                if [ -f "node_modules/.bin/prisma" ]; then
                  echo "Running Prisma migrations..."
                  NODE_ENV=production npx prisma migrate deploy --skip-generate
                  echo "Migration completed"
                elif [ -f "package.json" ]; then
                  echo "Running migrations via npm script..."
                  NODE_ENV=production npm run prisma:deploy || npm run db:migrate:deploy || npx prisma migrate deploy --skip-generate
                  echo "Migration attempt completed"
                else
                  echo "Could not find package.json or Prisma"
                  ls -la
                fi
                EOF
                
                chmod +x migrate.sh
                
                # Upload and execute the migration script
                echo "Uploading migration script..."
                az webapp deploy --resource-group $(resourceGroupName) --name $(appServiceName) --src-path migrate.sh --type startup --restart
                
                # Wait for restart and migration to complete
                sleep 45
                
                # Verify the migration worked by checking app logs
                echo "Checking recent application logs for migration results..."
                az webapp log tail --resource-group $(resourceGroupName) --name $(appServiceName) --timeout 30 || echo "Could not retrieve logs"
                
                echo "Migration process completed"