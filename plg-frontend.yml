# Azure DevOps Pipeline for Paycile Frontend Web App
trigger:
  branches:
    include:
    - main
    - develop
  paths:
    include:
    - paycile/*

variables:
  # Build variables
  nodeVersion: '20.x'
  workingDirectory: 'paycile'
  
  # Azure resources
  azureServiceConnection: 'plg-service-connection'
  staticWebAppName: 'prod-paycile-plg-web'
  resourceGroupName: 'prod-corp'

stages:
- stage: Build
  displayName: 'Build Frontend Web App'
  jobs:
  - job: Build
    displayName: 'Build'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'
    
    - task: Cache@2
      displayName: 'Cache pnpm dependencies'
      inputs:
        key: 'pnpm | "$(Agent.OS)" | $(workingDirectory)/pnpm-lock.yaml'
        path: '~/.pnpm-store'
        cacheHitVar: 'PNPM_CACHE_RESTORED'
    
    - script: |
        npm install -g pnpm@latest
    - script: |
        cd $(workingDirectory)
        pnpm install --frozen-lockfile
      displayName: 'Install dependencies'
    
    - script: |
        cd $(workingDirectory)
        echo "NEXT_PUBLIC_API_URL=$(NEXT_PUBLIC_API_URL)" > .env.production
      displayName: 'Create production environment file'
    
    - script: |
        cd $(workingDirectory)
        pnpm run build
      displayName: 'Build Next.js application'
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        pathToPublish: '$(workingDirectory)/out'
        artifactName: 'frontend-web'

- stage: Deploy_Dev
  displayName: 'Deploy to Development'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployDev
    displayName: 'Deploy to Dev Environment'
    environment: 'paycile-dev'
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      NEXT_PUBLIC_API_URL: 'https://prod-paycile-plg-api-dev.azurewebsites.net'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Azure Static Web Apps'
            inputs:
              app_location: '/'
              api_location: ''
              output_location: '/'
              azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN_DEV)'
              action: 'upload'
              app_build_command: 'echo "Already built"'
              skip_app_build: true

- stage: Deploy_Prod
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProd
    displayName: 'Deploy to Production Environment'
    environment: 'paycile-production'
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      NEXT_PUBLIC_API_URL: 'https://prod-paycile-plg-api.azurewebsites.net'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Azure Static Web Apps'
            inputs:
              app_location: '/'
              api_location: ''
              output_location: '/'
              azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN_PROD)'
              action: 'upload'
              app_build_command: 'echo "Already built"'
              skip_app_build: true